name: BTC AI Bot Cron
run-name: BTC AI Bot Cron - 5m aggressive tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call bot tick endpoint
        run: |
          echo "Workflow version: 5-minute aggressive bot tick"
          echo "BOT_TICK_URL configured: ${BOT_TICK_URL:+yes}"
          echo "CRON_SECRET configured: ${CRON_SECRET:+yes}"
          echo "Calling BTC AI bot at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          response=$(curl --fail --silent --show-error \
            -X POST "$BOT_TICK_URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "$response"
        env:
          BOT_TICK_URL: ${{ secrets.BOT_TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
